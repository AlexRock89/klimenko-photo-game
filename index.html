<title>Обычный день фотографа</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@400;500&display=swap">
<style>
  /* Схема: одна сцена по центру, вокруг глубокий фиолетовый, подпись с управлением под полотном */
  :root {
    --bg: #1b0f33;
    --panel: #2a1654;
    --fg: #f4ecff;
    --muted: #b7a4e0;
    --accent: #ffe14d;
    --pink: #ff3d7f;
    --display: "Press Start 2P", monospace;
    --body: "Rubik", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 12px;
    box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  #wrap { width: 100%; max-width: 1400px; display: flex; flex-direction: column; align-items: center; gap: 12px; min-width: 0; }
  canvas {
    display: block; image-rendering: pixelated; image-rendering: crisp-edges; cursor: none; max-width: 100%;
    border: 4px solid var(--pink); border-radius: 4px; box-shadow: 6px 6px 0 var(--panel); background: #5fd873; touch-action: none;
  }
  #hint { margin: 0; font-size: 13px; line-height: 1.4; color: var(--muted); text-align: center; text-wrap: balance; }
  #hint b { color: var(--accent); font-weight: 500; }
  @media (prefers-reduced-motion: reduce) { canvas { image-rendering: pixelated; } }
  body { overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: var(--bg); flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; padding: 24px; }
  #rotate .ph { width: 40px; height: 70px; border: 4px solid var(--accent); border-radius: 9px; animation: rot 2.4s ease-in-out infinite; }
  #rotate b { font-family: var(--display); font-size: 14px; line-height: 1.5; color: var(--accent); font-weight: 400; }
  #rotate span { font-size: 14px; color: var(--muted); }
  @keyframes rot { 0%, 25% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
  @media (pointer: coarse) {
    body { padding-top: 0; padding-bottom: 0; padding-left: max(env(safe-area-inset-left, 0px), env(safe-area-inset-right, 0px)); padding-right: max(env(safe-area-inset-left, 0px), env(safe-area-inset-right, 0px)); }
    #hint { display: none; }
    canvas { border: 0; border-radius: 0; box-shadow: none; }
  }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } #wrap { visibility: hidden; } }
</style>
<div id="rotate" aria-hidden="true"><div class="ph"></div><b>ПОВЕРНИ ТЕЛЕФОН</b><span>Игра работает в горизонтальном положении</span></div>
<main id="wrap">
  <canvas id="game" width="640" height="360" aria-label="Игра: фотограф Оксана снимает клиентов в парке"></canvas>
  <p id="hint"><b>WASD</b> или стрелки — бег · мышь — прицел · <b>ЛКМ</b> — снимок · <b>ПКМ</b> — фокус · <b>M</b> — звук · <b>N</b> — музыка · <b>Пробел</b> — пауза и правила. Играть с компьютера.</p>
</main>
<script src="art-people.js"></script>
<script src="art-world.js"></script>
<script src="actors.js"></script>
<script src="sounds-data.js"></script>
<script src="sound.js"></script>
<script src="systems.js"></script>
<script src="touch.js"></script>
<script src="game.js"></script>
